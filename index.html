<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png">
<title>JEE Vault</title>
<style>
:root{color-scheme:dark;--bg:#0f1115;--card:#181b22;--c2:#20242d;--tx:#e8eaf0;--mut:#8b92a3;--bd:#2a2f3a;--ac:#7c9cff;--ok:#4ade80;--bad:#f87171;--warn:#fbbf24;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:720px;margin:0 auto;padding:14px 14px 90px}
h1{font-size:22px;margin:4px 0 10px}
input,textarea{width:100%;background:var(--c2);color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:10px 12px;font:inherit;margin-bottom:10px}
textarea{min-height:80px;resize:vertical}
.row{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none}
.chip{flex:none;border:1px solid var(--bd);background:var(--card);color:var(--mut);padding:7px 13px;border-radius:99px;font:inherit;font-size:13px;cursor:pointer}
.chip.on{background:var(--ac);color:#0b0e14;border-color:var(--ac);font-weight:600}
.card{display:flex;gap:12px;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:10px;margin:10px 0;cursor:pointer}
.th{width:64px;height:64px;border-radius:10px;object-fit:cover;background:var(--c2);flex:none}
.ph{display:flex;align-items:center;justify-content:center;color:var(--mut);font-size:22px}
.ct{min-width:0;flex:1}.ct b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:5px;font-size:12px}
.b{padding:2px 8px;border-radius:99px;background:var(--c2);color:var(--mut)}
.empty{text-align:center;color:var(--mut);padding:50px 10px}
.fab{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;border:0;background:var(--ac);color:#0b0e14;font-size:30px;cursor:pointer;box-shadow:0 6px 20px #0008}
.sheet{position:fixed;inset:0;background:var(--bg);overflow-y:auto;z-index:5;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet .wrap{padding-bottom:40px}
label.l{display:block;color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:.05em;margin:12px 0 6px}
.btn{border:1px solid var(--bd);background:var(--c2);color:var(--tx);padding:10px 16px;border-radius:10px;font:inherit;cursor:pointer}
.btn.p{background:var(--ac);color:#0b0e14;border-color:var(--ac);font-weight:600}
.btn.d{color:var(--bad)}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.imgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;margin-bottom:8px}
.imgs div{position:relative}
.im{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;border:1px solid var(--bd);cursor:zoom-in}
.imgs.big{grid-template-columns:1fr}.imgs.big .im{aspect-ratio:auto;object-fit:contain;background:#000}
.x{position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:50%;border:0;background:#000b;color:#fff;cursor:pointer}
.up{display:inline-block}.up input{display:none}
.sec{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-top:14px}
.sec h3{margin:0 0 8px;font-size:15px}
.note{white-space:pre-wrap}
#zoom{position:fixed;inset:0;background:#000e;z-index:9;display:none;align-items:center;justify-content:center;padding:8px}
#zoom img{max-width:100%;max-height:100%}
.top{display:flex;align-items:center;gap:10px;margin-bottom:6px}
</style></head>
<body>
<div class="wrap">
  <h1>📚 JEE Vault</h1>
  <input id="q" type="search" placeholder="Search doubts, chapters, notes…">
  <div class="row" id="types"></div>
  <div class="row" id="subjs"></div>
  <div id="list"></div>
</div>
<button class="fab" data-a="new" aria-label="Add">+</button>
<div id="sheet" class="sheet" hidden></div>
<div id="zoom"><img alt=""></div>

<script>
const SUBJ=['Maths','Physics','IOC','PC','OC'];
const TYPES={doubt:'❓ Doubt',mistake:'❌ Test mistake',good:'⭐ Good question'};
const S={all:[],type:'all',subj:'all',q:'',view:null,draft:null,del:false};
let db=null,mem=[];
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function openDB(){return new Promise(r=>{try{const q=indexedDB.open('jeevault',1);q.onupgradeneeded=()=>q.result.createObjectStore('e',{keyPath:'id'});q.onsuccess=()=>{db=q.result;r()};q.onerror=()=>r()}catch(e){r()}})}
const DB={
 all(){return new Promise(r=>{if(!db)return r(mem);try{const q=db.transaction('e').objectStore('e').getAll();q.onsuccess=()=>r(q.result);q.onerror=()=>r([])}catch(e){r([])}})},
 put(e){return new Promise(r=>{if(!db){mem=mem.filter(x=>x.id!==e.id).concat(e);return r()}try{const t=db.transaction('e','readwrite');t.objectStore('e').put(e);t.oncomplete=r;t.onerror=r}catch(x){r()}})},
 del(id){return new Promise(r=>{if(!db){mem=mem.filter(x=>x.id!==id);return r()}try{const t=db.transaction('e','readwrite');t.objectStore('e').delete(id);t.oncomplete=r;t.onerror=r}catch(x){r()}})}
};
function comp(f){return new Promise(res=>{const im=new Image(),u=URL.createObjectURL(f);im.onload=()=>{const s=Math.min(1,1400/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',.8))};im.onerror=()=>res(null);im.src=u})}

async function load(){S.all=(await DB.all()).sort((a,b)=>b.ts-a.ts);list()}
function chips(){
 document.getElementById('types').innerHTML=[['all','All'],...Object.entries(TYPES)].map(([k,v])=>`<button class="chip ${S.type===k?'on':''}" data-a="type" data-v="${k}">${v}</button>`).join('');
 document.getElementById('subjs').innerHTML=['all',...SUBJ].map(k=>`<button class="chip ${S.subj===k?'on':''}" data-a="subj" data-v="${k}">${k==='all'?'All subjects':k}</button>`).join('');
}
function list(){
 chips();
 const q=S.q.toLowerCase();
 const L=S.all.filter(e=>(S.type==='all'||e.type===S.type)&&(S.subj==='all'||e.subj===S.subj)&&(!q||(e.title+' '+e.chapter+' '+e.notes+' '+e.sol).toLowerCase().includes(q)));
 document.getElementById('list').innerHTML=L.length?L.map(e=>`<div class="card" data-a="open" data-id="${e.id}">
  ${e.qimgs[0]?`<img class="th" src="${e.qimgs[0]}" alt="">`:`<div class="th ph">${e.type==='doubt'?'❓':e.type==='mistake'?'❌':'⭐'}</div>`}
  <div class="ct"><b>${esc(e.title)||'Untitled'}</b>
  <div class="meta"><span class="b">${e.subj}</span><span class="b">${TYPES[e.type]}</span>${e.chapter?`<span class="b">${esc(e.chapter)}</span>`:''}
  ${e.type==='doubt'?(e.solved?'<span class="b" style="color:var(--ok)">Solved</span>':'<span class="b" style="color:var(--warn)">Unsolved</span>'):''}
  ${e.simgs.length||e.sol?'<span class="b" style="color:var(--ok)">Has solution</span>':''}</div></div></div>`).join(''):'<div class="empty">Nothing here yet.<br>Tap + to add your first entry.</div>';
}
const imgGrid=(arr,k,rm)=>arr.length?`<div class="imgs">${arr.map((s,i)=>`<div><img class="im" src="${s}" alt="">${rm?`<button class="x" data-a="rm" data-k="${k}" data-i="${i}">×</button>`:''}</div>`).join('')}</div>`:'';
const upBtn=(k,w,txt)=>`<label class="btn up">${txt}<input type="file" accept="image/*" multiple data-k="${k}" data-w="${w}"></label>`;

function sheet(){
 const el=document.getElementById('sheet');
 if(S.draft){
  const d=S.draft;
  el.hidden=false;
  el.innerHTML=`<div class="wrap"><h1>${d.new?'New entry':'Edit entry'}</h1>
  <label class="l">Type</label><div class="row">${Object.entries(TYPES).map(([k,v])=>`<button class="chip ${d.type===k?'on':''}" data-a="dt" data-v="${k}">${v}</button>`).join('')}</div>
  <label class="l">Subject</label><div class="row">${SUBJ.map(k=>`<button class="chip ${d.subj===k?'on':''}" data-a="ds" data-v="${k}">${k}</button>`).join('')}</div>
  <label class="l">Title / topic</label><input data-f="title" value="${esc(d.title)}" placeholder="e.g. Rotational motion – rolling without slipping">
  <label class="l">Chapter</label><input data-f="chapter" value="${esc(d.chapter)}" placeholder="e.g. Mole concept">
  <label class="l">Notes ${d.type==='mistake'?'(why did I go wrong?)':d.type==='good'?'(why is it good?)':'(what exactly is my doubt?)'}</label><textarea data-f="notes">${esc(d.notes)}</textarea>
  <label class="l">Question pictures</label>${imgGrid(d.qimgs,'qimgs',1)}${upBtn('qimgs','draft','📷 Add pictures')}
  <label class="l">Solution pictures</label>${imgGrid(d.simgs,'simgs',1)}${upBtn('simgs','draft','📷 Add solution')}
  <label class="l">Solution notes</label><textarea data-f="sol" placeholder="Key steps, formula, trick…">${esc(d.sol)}</textarea>
  <div class="acts"><button class="btn p" data-a="save">Save</button><button class="btn" data-a="cancel">Cancel</button></div></div>`;
 }else if(S.view){
  const e=S.all.find(x=>x.id===S.view);
  if(!e){S.view=null;return sheet()}
  el.hidden=false;
  el.innerHTML=`<div class="wrap"><div class="top"><button class="btn" data-a="close">← Back</button></div>
  <h1>${esc(e.title)||'Untitled'}</h1>
  <div class="meta"><span class="b">${e.subj}</span><span class="b">${TYPES[e.type]}</span>${e.chapter?`<span class="b">${esc(e.chapter)}</span>`:''}<span class="b">${new Date(e.ts).toLocaleDateString()}</span></div>
  <div class="sec"><h3>Question</h3>${e.qimgs.length?`<div class="imgs big">${e.qimgs.map(s=>`<img class="im" src="${s}" alt="">`).join('')}</div>`:'<div class="b" style="display:inline-block">No pictures</div>'}
  ${e.notes?`<p class="note">${esc(e.notes)}</p>`:''}</div>
  <div class="sec"><h3>✅ Solution</h3>${e.simgs.length?`<div class="imgs big">${e.simgs.map(s=>`<img class="im" src="${s}" alt="">`).join('')}</div>`:''}
  ${e.sol?`<p class="note">${esc(e.sol)}</p>`:''}
  ${!e.simgs.length&&!e.sol?'<p style="color:var(--mut)">No solution added yet.</p>':''}
  ${upBtn('simgs','detail','📷 Upload solution')}</div>
  <div class="acts">${e.type==='doubt'?`<button class="btn" data-a="solved">${e.solved?'Mark unsolved':'Mark solved ✓'}</button>`:''}
  <button class="btn" data-a="edit">Edit</button>
  <button class="btn d" data-a="del">${S.del?'Tap again to delete':'Delete'}</button></div></div>`;
 }else{el.hidden=true;el.innerHTML=''}
}
const blank=()=>({id:'e'+Date.now(),new:true,ts:Date.now(),type:S.type!=='all'?S.type:'doubt',subj:S.subj!=='all'?S.subj:'Maths',title:'',chapter:'',notes:'',sol:'',qimgs:[],simgs:[],solved:false});

document.addEventListener('click',async ev=>{
 const im=ev.target.closest('img.im');
 if(im){const z=document.getElementById('zoom');z.querySelector('img').src=im.src;z.style.display='flex';return}
 if(ev.target.closest('#zoom')){document.getElementById('zoom').style.display='none';return}
 const t=ev.target.closest('[data-a]');if(!t)return;
 const a=t.dataset.a,v=t.dataset.v,d=S.draft;
 if(a==='type'){S.type=v;list()}
 else if(a==='subj'){S.subj=v;list()}
 else if(a==='new'){S.draft=blank();sheet()}
 else if(a==='open'){S.view=t.dataset.id;S.del=false;sheet()}
 else if(a==='close'){S.view=null;S.del=false;sheet()}
 else if(a==='dt'){d.type=v;sheet()}
 else if(a==='ds'){d.subj=v;sheet()}
 else if(a==='rm'){d[t.dataset.k].splice(+t.dataset.i,1);sheet()}
 else if(a==='cancel'){S.draft=null;sheet()}
 else if(a==='save'){const e={...d};delete e.new;if(!e.title.trim())e.title=(e.chapter||'Untitled');await DB.put(e);S.draft=null;S.view=e.id;await load();sheet()}
 else if(a==='edit'){S.draft={...S.all.find(x=>x.id===S.view)};S.draft.qimgs=[...S.draft.qimgs];S.draft.simgs=[...S.draft.simgs];S.view=S.draft.id;sheet()}
 else if(a==='solved'){const e=S.all.find(x=>x.id===S.view);e.solved=!e.solved;await DB.put(e);await load();sheet()}
 else if(a==='del'){if(!S.del){S.del=true;sheet();return}await DB.del(S.view);S.view=null;S.del=false;await load();sheet()}
});
document.addEventListener('input',ev=>{
 const t=ev.target;
 if(t.id==='q'){S.q=t.value;list()}
 else if(t.dataset.f&&S.draft)S.draft[t.dataset.f]=t.value;
});
document.addEventListener('change',async ev=>{
 const t=ev.target;if(t.type!=='file')return;
 const out=[];for(const f of t.files){const s=await comp(f);if(s)out.push(s)}
 const k=t.dataset.k,w=t.dataset.w;t.value='';
 if(w==='draft'&&S.draft){S.draft[k]=S.draft[k].concat(out);sheet()}
 else if(w==='detail'){const e=S.all.find(x=>x.id===S.view);if(e){e[k]=e[k].concat(out);await DB.put(e);await load();sheet()}}
});
openDB().then(load);
try{navigator.storage.persist()}catch(e){}
try{navigator.serviceWorker.register("sw.js")}catch(e){}
</script>
</body></html>
